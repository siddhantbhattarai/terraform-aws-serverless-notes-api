<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" rx="24" fill="#f4f8ff"/><text x="55" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#102a43">Serverless Notes API</text><text x="55" y="102" font-family="Arial" font-size="18" fill="#5b738d">API requests flow through managed services with scoped access and durable data.</text><rect x="55" y="150" width="1090" height="330" rx="24" fill="#fff" stroke="#c6d9ef" stroke-width="2"/><g font-family="Arial"><rect x="95" y="255" width="180" height="110" rx="15" fill="#eaf2ff"/><text x="185" y="300" text-anchor="middle" font-size="21" font-weight="700" fill="#1f5fa8">Client</text><text x="185" y="330" text-anchor="middle" font-size="15" fill="#52708e">curl / browser</text><rect x="390" y="235" width="220" height="150" rx="15" fill="#fff4dc"/><text x="500" y="295" text-anchor="middle" font-size="23" font-weight="700" fill="#9a6100">API Gateway</text><text x="500" y="327" text-anchor="middle" font-size="15" fill="#765b35">HTTP API routes</text><rect x="725" y="235" width="220" height="150" rx="15" fill="#f0edff"/><text x="835" y="295" text-anchor="middle" font-size="23" font-weight="700" fill="#6846aa">AWS Lambda</text><text x="835" y="327" text-anchor="middle" font-size="15" fill="#665b80">Python Notes handler</text><rect x="955" y="235" width="150" height="150" rx="15" fill="#e7f7ed"/><text x="1030" y="292" text-anchor="middle" font-size="20" font-weight="700" fill="#147147">DynamoDB</text><text x="1030" y="323" text-anchor="middle" font-size="14" fill="#4d735c">Encrypted notes</text><rect x="94" y="420" width="1010" height="34" rx="17" fill="#102a43"/><text x="599" y="442" text-anchor="middle" font-size="15" fill="#fff">Terraform provisions the API, function, permissions, logs, and encrypted database.</text><rect x="275" y="306" width="115" height="6" rx="3" fill="#2563eb"/><path d="M375 298l15 11-15 11z" fill="#2563eb"/><rect x="610" y="