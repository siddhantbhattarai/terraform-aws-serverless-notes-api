<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Serverless Notes API architecture</title><desc id="desc">A client calls API Gateway, which invokes Lambda. Lambda reads and writes DynamoDB and emits logs to CloudWatch.</desc>
  <rect width="1440" height="760" rx="28" fill="#f4f8ff"/>
  <text x="70" y="75" font-family="Arial" font-size="38" font-weight="700" fill="#102a43">Serverless Notes API</text>
  <text x="70" y="108" font-family="Arial" font-size="19" fill="#5b738d">A scalable HTTP API without managing servers, built from managed AWS services.</text>
  <rect x="70" y="155" width="1300" height="440" rx="25" fill="#fff" stroke="#c6d9ef" stroke-width="2"/>
  <text x="105" y="202" font-family="Arial" font-size="17" font-weight="700" letter-spacing="2" fill="#52708e">AWS ACCOUNT · APPLICATION REQUEST FLOW</text>
  <g font-family="Arial">
    <rect x="120" y="290" width="210" height="150" rx="18" fill="#eaf2ff"/><circle cx="165" cy="340" r="20" fill="#cfe1ff"/><text x="225" y="344" text-anchor="middle" font-size="23" font-weight="700" fill="#205fa7">Client</text><text x="225" y="380" text-anchor="middle" font-size="16" fill="#52708e">Browser, mobile, curl</text>
    <rect x="430" y="290" width="210" height="150" rx="18" fill="#fff4dc"/><rect x="455" y="320" width="34" height="34" rx="8" fill="#fbe5a7"/><text x="548" y="344" text-anchor="middle" font-size="23" font-weight="700" fill="#9a6100">API Gateway</text><text x="535" y="380" text-anchor="middle" font-size="16" fill="#765b35">HTTP routes + access logs</text>
    <rect x="740" y="290" width="210" height="150" rx="18" fill="#f0edff"/><rect x="765" y="320" width="34" height="34" rx="8" fill="#dfd4ff"/><text x="858" y="344" text-anchor="middle" font-size="23" font-weight="700" fill="#6846aa">Lambda</text><text x="845" y="380" text-anchor="middle" font-size="16" fill="#665b80">Python CRUD handler</text>
    <rect x="1050" y="290" width="210" height="150" rx="18" fill="#e7f7ed"/><rect x="1075" y="320" width="34" height="34" rx="8" fill="#c9edd6"/><text x="1168" y="344" text-anchor="middle" font-size="23" font-weight="700" fill="#147147">DynamoDB</text><text x="1155" y="380" text-anchor="middle" font-size="16" fill="#4d735c">Encrypted notes + PITR</text>
    <rect x="790" y="492" width="210" height="64" rx="15" fill="#edf4fb"/><text x="895" y="531" text-anchor="middle" font-size="17" font-weight="700" fill="#29588d">CloudWatch Logs</text>
    <rect x="330" y="362" width="100" height="6" rx="3" fill="#2563eb"/><path d="M415 354l15 11-15 11z" fill="#2563eb"/><rect x="640" y="362" width="100" height="6" rx="3" fill="#2563eb"/><path d="M725 354l15 11-15 11z" fill="#2563eb"/><rect x="950" y="362" width="100" height="6" rx="3" fill="#2563eb"/><path d="M1035 354l15 11-15 11z" fill="#2563eb"/>
    <path d="M845 440V477" stroke="#2563eb" stroke-width="6"/><path d="M837 462l8 15 8-15z" fill="#2563eb"/>
    <rect x="343" y="320" width="74" height="29" rx="14" fill="#eaf2ff"/><text x="380" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">HTTPS</text><rect x="653" y="320" width="74" height="29" rx="14" fill="#f0edff"/><text x="690" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#6846aa">Invoke</text><rect x="963" y="320" width="74" height="29" rx="14" fill="#e7f7ed"/><text x="1000" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#147147">CRUD</text>
  </g>
  <rect x="70" y="635" width="1300" height="75" rx="18" fill="#102a43"/><text x="110" y="681" font-family="Arial" font-size="18" font-weight="700" fill="#fff">Terraform creates the API, runtime, permissions, durable storage, encryption, and observability together.</text>
</svg>
